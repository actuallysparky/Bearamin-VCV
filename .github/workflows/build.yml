name: Build and test Bearamin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: lin-x64
          - runner: macos-15
            platform: mac-arm64
          - runner: macos-15-intel
            platform: mac-x64
          - runner: windows-2022
            platform: win-x64
    runs-on: ${{ matrix.runner }}
    env:
      RACK_SDK_VERSION: 2.6.6
      COPYFILE_DISABLE: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential jq zstd unzip pkg-config libjansson-dev libgl1 libasound2 libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libjack-jackd2-0 libpulse0
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install jq zstd jansson pkg-config
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-jansson mingw-w64-x86_64-pkgconf mingw-w64-x86_64-python git make jq zstd unzip curl diffutils
      - name: Fetch SDK and build (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p _local/sdk
          curl --fail --location --retry 3 "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.platform }}.zip" -o _local/sdk.zip
          unzip -q _local/sdk.zip -d _local/sdk
          ./test.sh --rack "$PWD/_local/sdk/Rack-SDK"
          make -j2 dist RACK_DIR="$PWD/_local/sdk/Rack-SDK"
          python3 tools/check_package.py dist/*.vcvplugin
      - name: Fetch SDK and build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p _local/sdk
          curl --fail --location --retry 3 "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-win-x64.zip" -o _local/sdk.zip
          unzip -q _local/sdk.zip -d _local/sdk
          # The Windows SDK has an import library, not the runtime DLL.
          # Extract only that DLL; never execute/install the downloaded installer.
          curl --fail --location --retry 3 "https://vcvrack.com/downloads/RackFree-${RACK_SDK_VERSION}-win-x64.exe" -o _local/RackFree.exe
          "/c/Program Files/7-Zip/7z.exe" e _local/RackFree.exe libRack.dll -o_local/sdk/Rack-SDK -y
          test -f _local/sdk/Rack-SDK/libRack.dll
          ./test.sh --rack "$PWD/_local/sdk/Rack-SDK"
          make -j2 dist RACK_DIR="$PWD/_local/sdk/Rack-SDK"
          python3 tools/check_package.py dist/*.vcvplugin
      - uses: actions/upload-artifact@v4
        with:
          name: Bearamin-${{ matrix.platform }}
          path: dist/*.vcvplugin
          if-no-files-found: error
